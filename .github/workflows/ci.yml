name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Daily, so a change on Idle Hours' main shows up in idle-hours-main
  # without waiting for a pull request here.
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Test
        run: pytest -q

  idle-hours-main:
    # Advisory: not in .github/rulesets/main-branch.json. Runs the suite
    # against Idle Hours' main instead of the commit pyproject.toml pins, so
    # a breaking change there shows up here before the next pin bump.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install against Idle Hours main
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --force-reinstall "idle-hours @ git+https://github.com/gkoch02/IdleHours@main"
          pip freeze | grep -i '^idle-hours'

      - name: Test
        run: pytest -q
